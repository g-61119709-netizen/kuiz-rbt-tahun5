<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuiz RBT Tahun 5 - Pertanian Bandar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f0fdf4; }
        .font-heading { font-family: 'Fredoka', sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between text-slate-800">

    <header class="bg-emerald-600 text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-white/20 p-2 rounded-lg">
                    <i class="fa-solid fa-seedling text-2xl text-yellow-300"></i>
                </div>
                <div>
                    <h1 class="font-heading text-xl md:text-2xl font-bold tracking-wide">Kuiz RBT Tahun 5</h1>
                    <p class="text-xs md:text-sm text-emerald-100">Unit: Pertanian Bandar & Tanaman Moden</p>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-8 w-full flex-grow">

        <!-- Mula Kuiz -->
        <div id="start-card" class="bg-white rounded-2xl shadow-xl p-6 md:p-8 text-center border border-emerald-100">
            <div class="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">
                <i class="fa-solid fa-wheat-awn"></i>
            </div>
            <h2 class="font-heading text-2xl md:text-3xl font-bold text-slate-800 mb-2">Uji Kefahaman Pertanian Bandar</h2>
            <p class="text-slate-600 mb-6 text-sm md:text-base max-w-lg mx-auto">
                Uji pengetahuan anda mengenai kaedah penanaman moden, jenis sistem takungan, dan bekas pengairan kendiri!
            </p>
            <button onclick="startQuiz()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition duration-200 text-lg">
                Mula Kuiz Sekarang
            </button>
        </div>

        <!-- Soalan Kuiz -->
        <div id="quiz-card" class="hidden bg-white rounded-2xl shadow-xl p-6 md:p-8 border border-emerald-100">
            <div class="mb-6">
                <div class="flex justify-between items-center text-xs md:text-sm font-semibold text-slate-500 mb-2">
                    <span id="question-number-text">Soalan 1</span>
                    <span id="score-live-text" class="text-emerald-600 font-bold">Skor: 0</span>
                </div>
                <div class="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden">
                    <div id="progress-bar" class="bg-emerald-500 h-2.5 rounded-full transition-all duration-300" style="width: 10%"></div>
                </div>
            </div>

            <div class="mb-3">
                <span id="question-tag" class="inline-block bg-emerald-100 text-emerald-700 text-xs px-3 py-1 rounded-full font-semibold">
                    Pertanian Bandar
                </span>
            </div>

            <h3 id="question-text" class="font-heading text-lg md:text-xl font-bold text-slate-800 mb-4">
                Teks soalan...
            </h3>

            <!-- BAHAGIAN GAMBAR SOALAN -->
            <div id="image-container" class="hidden mb-6 text-center">
                <img id="question-image" src="" alt="Gambar Soalan" class="max-h-60 rounded-xl mx-auto border border-slate-200 shadow-sm object-contain">
            </div>

            <div id="options-container" class="space-y-3 mb-6"></div>

            <div id="feedback-box" class="hidden p-4 rounded-xl mb-6 text-sm">
                <div id="feedback-status" class="font-bold mb-1 flex items-center"></div>
                <div id="feedback-rationale" class="text-slate-700"></div>
            </div>

            <div class="flex justify-end">
                <button id="next-btn" onclick="nextQuestion()" disabled class="bg-slate-300 text-slate-500 cursor-not-allowed font-bold py-2.5 px-6 rounded-xl shadow transition duration-200">
                    Soalan Seterusnya
                </button>
            </div>
        </div>

        <!-- Keputusan -->
        <div id="result-card" class="hidden bg-white rounded-2xl shadow-xl p-6 md:p-8 text-center border border-emerald-100">
            <h2 class="font-heading text-2xl font-bold mb-2">Tahniah!</h2>
            <div class="text-4xl font-black text-emerald-600 mb-4" id="final-score">0 / 0</div>
            <button onclick="restartQuiz()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-8 rounded-xl shadow-lg">
                Cuba Lagi
            </button>
        </div>

    </main>

<script>
    const quizData = [
        {
            tag: "Bekas Pengairan Kendiri",
            question: "Apakah nama bahan berpori yang dimasukkan ke dalam ruang kapilari untuk menyerap air?",
            image: "leca.jpg",
            options: [
                "Light Expanded Clay Aggregate (LECA)",
                "Pasir Sungai",
                "Kepingan Kayu",
                "Batu Bata"
            ],
            correctIndex: 0,
            rationale: "LECA dan tali mop merupakan bahan yang boleh menyerap air untuk membawa air naik dari takung ke medium penanaman."
        },
        {
            tag: "Pertanian Bandar",
            question: "Apakah yang dimaksudkan dengan Pertanian Bandar?",
            image: null,
            options: [
                "Aktiviti bercucuk tanam bagi menghasilkan makanan di sekitar rumah yang mempunyai ruang terhad.",
                "Penternakan lembu secara komersial di kawasan luar bandar.",
                "Penanaman hutan semula di kawasan tanah tinggi.",
                "Pembinaan kilang baja kimia di bandar."
            ],
            correctIndex: 0,
            rationale: "Pertanian bandar dilakukan di kediaman beruang terhad seperti rumah pangsa, kondominium, dan rumah teres."
        }
    ];

    let currentQuestion = 0;
    let score = 0;
    let currentShuffledOptions = []; // Menyimpan pilihan jawapan yang telah dirawakkan

    function startQuiz() {
        document.getElementById('start-card').classList.add('hidden');
        document.getElementById('quiz-card').classList.remove('hidden');
        currentQuestion = 0;
        score = 0;
        showQuestion();
    }

    function showQuestion() {
        const q = quizData[currentQuestion];

        document.getElementById('question-number-text').innerText = `Soalan ${currentQuestion + 1} daripada ${quizData.length}`;
        document.getElementById('score-live-text').innerText = `Skor: ${score}`;
        document.getElementById('progress-bar').style.width = `${((currentQuestion + 1) / quizData.length) * 100}%`;
        document.getElementById('question-tag').innerText = q.tag;
        document.getElementById('question-text').innerText = q.question;

        // Kendall Gambar
        const imageContainer = document.getElementById('image-container');
        const questionImage = document.getElementById('question-image');

        if (q.image) {
            questionImage.src = q.image;
            imageContainer.classList.remove('hidden');
        } else {
            imageContainer.classList.add('hidden');
        }

        document.getElementById('feedback-box').classList.add('hidden');
        const nextBtn = document.getElementById('next-btn');
        nextBtn.disabled = true;
        nextBtn.className = "bg-slate-300 text-slate-500 cursor-not-allowed font-bold py-2.5 px-6 rounded-xl shadow transition duration-200";

        // ========================================================
        // PROSES MERAWAKKAN (SHUFFLE) PILIHAN JAWAPAN
        // ========================================================
        // 1. Tandakan jawapan betul/salah berdasarkan correctIndex asal
        currentShuffledOptions = q.options.map((optText, index) => {
            return {
                text: optText,
                isCorrect: index === q.correctIndex
            };
        });

        // 2. Susun pilihan jawapan secara rawak menggunakan Math.random()
        currentShuffledOptions.sort(() => Math.random() - 0.5);
        // ========================================================

        // Paparkan butang pilihan jawapan selepas dirawakkan
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';

        currentShuffledOptions.forEach((optObj, index) => {
            const btn = document.createElement('button');
            btn.className = "w-full text-left p-4 rounded-xl border-2 border-slate-200 hover:border-emerald-400 hover:bg-emerald-50/50 transition duration-150 flex items-start space-x-3";
            btn.onclick = () => selectOption(index);
            btn.innerHTML = `
                <span class="w-6 h-6 rounded-full border-2 border-slate-300 flex items-center justify-center text-xs font-bold shrink-0 mt-0.5">
                    ${String.fromCharCode(65 + index)}
                </span>
                <span class="text-slate-700 text-sm md:text-base">${optObj.text}</span>
            `;
            optionsContainer.appendChild(btn);
        });
    }

    function selectOption(selectedIndex) {
        const q = quizData[currentQuestion];
        const selectedObj = currentShuffledOptions[selectedIndex];
        const isCorrect = selectedObj.isCorrect;

        if (isCorrect) score++;

        const optionsContainer = document.getElementById('options-container');
        const buttons = optionsContainer.children;

        // Warnakan pilihan jawapan
        for (let i = 0; i < buttons.length; i++) {
            buttons[i].disabled = true;
            const optObj = currentShuffledOptions[i];

            if (optObj.isCorrect) {
                // Pilihan betul sentiasa diwarnakan hijau
                buttons[i].className = "w-full text-left p-4 rounded-xl border-2 border-emerald-500 bg-emerald-50 text-emerald-800 font-medium flex items-start space-x-3";
            } else if (i === selectedIndex && !isCorrect) {
                // Pilihan salah yang dipilih murid diwarnakan merah
                buttons[i].className = "w-full text-left p-4 rounded-xl border-2 border-rose-400 bg-rose-50 text-rose-800 flex items-start space-x-3";
            } else {
                buttons[i].className = "w-full text-left p-4 rounded-xl border-2 border-slate-100 bg-slate-50 opacity-60 flex items-start space-x-3";
            }
        }

        const feedbackBox = document.getElementById('feedback-box');
        feedbackBox.classList.remove('hidden');
        feedbackBox.className = `p-4 rounded-xl mb-6 text-sm ${isCorrect ? 'bg-emerald-50 border border-emerald-200 text-emerald-900' : 'bg-rose-50 border border-rose-200 text-rose-900'}`;
        document.getElementById('feedback-status').innerHTML = isCorrect ? '<i class="fa-solid fa-circle-check text-emerald-600 mr-2"></i> Tepat!' : '<i class="fa-solid fa-circle-xmark text-rose-600 mr-2"></i> Kurang Tepat';
        document.getElementById('feedback-rationale').innerText = q.rationale;

        const nextBtn = document.getElementById('next-btn');
        nextBtn.disabled = false;
        nextBtn.className = "bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 px-6 rounded-xl shadow hover:shadow-md transition duration-200";
    }

    function nextQuestion() {
        currentQuestion++;
        if (currentQuestion < quizData.length) {
            showQuestion();
        } else {
            document.getElementById('quiz-card').classList.add('hidden');
            document.getElementById('result-card').classList.remove('hidden');
            document.getElementById('final-score').innerText = `${score} / ${quizData.length}`;
        }
    }

    function restartQuiz() {
        document.getElementById('result-card').classList.add('hidden');
        document.getElementById('start-card').classList.remove('hidden');
    }
</script>
</body>
</html>
